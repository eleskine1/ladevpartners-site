[build]
  publish = "."

# No build command needed — pure static site

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www to apex
[[redirects]]
  from = "https://www.ladevpartners.com/*"
  to = "https://ladevpartners.com/:splat"
  status = 301
  force = true
